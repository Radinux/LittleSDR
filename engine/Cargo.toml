[package]
name = "littlesdr-engine"
version = "0.1.0"
edition = "2021"
description = "LittleSDR SDR engine: sources, DSP chain with live reconfiguration, audio output"
license = "GPL-3.0-or-later"

[lib]
name = "littlesdr"
path = "src/lib.rs"
# rlib for the CLI and tests, cdylib: liblittlesdr.so loaded by the Android app
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "littlesdr"
path = "src/main.rs"

[features]
default = ["rtlsdr", "audio"]
# RTL-SDR over USB through the system librtlsdr
rtlsdr = []
# Sound card output (cpal: ALSA / PipeWire on Linux, AAudio on Android later)
audio = ["dep:cpal"]

[dependencies]
cpal = { version = "0.15", optional = true }
rustfft = "6"
serde_json = "1"

[profile.dev]
opt-level = 2 # DSP is unusable unoptimized

[profile.release]
opt-level = 3
lto = "thin"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ash = { version = "0.38", default-features = false, features = ["linked", "std"] }
