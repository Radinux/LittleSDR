[package]
name = "littlesdr-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "LittleSDR on the Linux desktop: the Rust engine with an egui interface (prototype)"

[dependencies]
littlesdr-engine = { path = "../engine" }
eframe = "0.31"
cpal = "0.15"
serde_json = "1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
